# Frontend tests: the node unit suite (src/frontend/src/lib/*.test.js and the componentruntime and
# editor suites) and every jsdom DOM harness (src/frontend/test/*.dom.mjs). Both run without a Wails
# backend: services.js is redirected to test/stubs/ by the tests that load it, and the builtin sources
# are generated here, as the build does. The real-browser harnesses (test/browser/*.browser.mjs) need
# a Chromium binary and are run locally, not here.
#
# A DOM harness can print FAIL or UNCAUGHT and still exit 0 (its uncaught-error handler keeps the process
# alive), so a harness fails the job on either a non-zero exit or a FAIL/UNCAUGHT line in its output.
name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Unit tests (generates the builtin sources first)
        run: npm test

      - name: DOM harnesses (exit code and FAIL/UNCAUGHT lines)
        run: npm run test:dom
