version: "2"

linters:
  default: standard
  enable:
    - ineffassign
    - misspell
    - unconvert
  settings:
    errcheck:
      # Closing sql rows/statements and OS files cannot meaningfully be
      # handled at the call site (query errors surface from Query/Exec;
      # rows are drained via rows.Err). Repo convention: ignore Close,
      # never Commit/Query.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*os.File).Close
  exclusions:
    paths:
      # Framework-owned stock/regenerated Wails build assets (mobile helper
      # stubs etc.) — not application code; regenerated by
      # `wails3 task common:update:build-assets`.
      - '^build/'
      # Reference implementation kept byte-compatible with the original
      # research extractor (only gofmt-normalized); not application code.
      - '^ref/'

formatters:
  enable:
    - gofmt
    - goimports
