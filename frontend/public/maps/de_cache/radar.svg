<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- de_cache schematic radar — original abstract art, not derived from any
       Valve asset. Rough site placement (A upper-right, B lower-left) will be
       refined from golden-demo data later. -->
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#d7dde8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="#0b0e13"/>

  <!-- grid -->
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- abstract schematic blocks (original geometry, purely indicative) -->
  <g fill="#161b24" stroke="#232a37" stroke-width="2">
    <rect x="150" y="620" width="260" height="220" rx="8"/>
    <rect x="640" y="160" width="240" height="200" rx="8"/>
    <rect x="420" y="400" width="180" height="240" rx="8"/>
    <rect x="190" y="180" width="180" height="150" rx="8"/>
    <rect x="700" y="640" width="170" height="180" rx="8"/>
    <rect x="440" y="120" width="140" height="120" rx="8"/>
    <rect x="140" y="420" width="130" height="120" rx="8"/>
  </g>
  <!-- connective lanes -->
  <g fill="none" stroke="#232a37" stroke-width="18" stroke-linecap="round" opacity="0.8">
    <path d="M 330 250 L 500 460"/>
    <path d="M 500 520 L 280 660"/>
    <path d="M 590 480 L 740 300"/>
    <path d="M 560 600 L 780 700"/>
    <path d="M 510 240 L 520 400"/>
    <path d="M 270 480 L 280 620"/>
  </g>

  <!-- map bounds -->
  <rect x="24" y="24" width="976" height="976" fill="none" stroke="#3a4356" stroke-width="3"/>

  <!-- site markers (rough) -->
  <text x="760" y="320" font-family="system-ui, sans-serif" font-size="180" font-weight="800"
        fill="#e6a35a" fill-opacity="0.16" text-anchor="middle">A</text>
  <text x="280" y="780" font-family="system-ui, sans-serif" font-size="180" font-weight="800"
        fill="#5aa9e6" fill-opacity="0.16" text-anchor="middle">B</text>

  <!-- title -->
  <text x="512" y="70" font-family="system-ui, sans-serif" font-size="34" font-weight="700"
        letter-spacing="14" fill="#8b94a7" text-anchor="middle">DE_CACHE</text>
  <text x="512" y="96" font-family="system-ui, sans-serif" font-size="15"
        letter-spacing="4" fill="#8b94a7" fill-opacity="0.55" text-anchor="middle">SCHEMATIC — NOT AN OFFICIAL RADAR</text>

  <!-- north indicator -->
  <g transform="translate(80, 110)">
    <circle r="34" fill="none" stroke="#3a4356" stroke-width="2"/>
    <path d="M 0 -24 L 9 10 L 0 4 L -9 10 Z" fill="#f5a618"/>
    <text x="0" y="-38" font-family="system-ui, sans-serif" font-size="18" font-weight="700"
          fill="#d7dde8" text-anchor="middle">N</text>
  </g>
</svg>
